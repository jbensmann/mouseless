name: Build and Release

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Extract release notes
      run: |
        awk '
          /^## / {
            h++
            if (h == 1) next
            else exit
          }
          h == 1 {
            sub(/^### /, "## ")
            n++
            lines[n] = $0
          }
          END {
            s = 1
            while (s <= n && lines[s] ~ /^$/) s++
            e = n
            while (e >= s && lines[e] ~ /^$/) e--
            for (i = s; i <= e; i++) print lines[i]
          }
        ' CHANGELOG.md > release_notes.md
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: "~> v2"
        args: |
          release --clean --release-notes release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
