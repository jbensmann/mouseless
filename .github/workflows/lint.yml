name: lint

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.1.2
