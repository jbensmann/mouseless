version: 2

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    binary: mouseless
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    main: .

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - mouseless*
    wrap_in_directory: false

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

release:
  github:
    owner: jbensmann
    name: mouseless
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"